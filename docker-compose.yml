services:
  emqx:
    build: ./emqx-plugin
    container_name: emqx
    ports:
      - "1883:1883"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/api/v5/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  publisher:
    depends_on:
      emqx:
        condition: service_healthy
      subscriber:
        condition: service_started
    image: python:3-slim
    container_name: publisher
    working_dir: /app
    volumes:
      - ./publisher:/app
    command: ["sh", "-c", "pip install -q paho-mqtt && python publish.py"]

  subscriber:
    depends_on:
      emqx:
        condition: service_healthy
    image: python:3-slim
    container_name: subscriber
    working_dir: /app
    volumes:
      - ./subscriber:/app
    command: ["sh", "-c", "pip install -q paho-mqtt && python subscribe.py"]

  registry:
    image: python:3-slim
    container_name: registry
    working_dir: /app
    volumes:
      - ./registry:/app
    command: ["python", "app.py"]